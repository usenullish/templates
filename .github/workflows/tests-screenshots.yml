name: Update E2E Screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # persist-credentials required to commit screenshots

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Prepare Playwright
        run: npm run e2e:playwright:install

      - name: Run Playwright tests
        run: npm run e2e:snapshots

      - name: Commit Playwright updated screenshots
        uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        if: ${{ github.ref != 'refs/heads/main' }}
        with:
          add: ./e2e
          default_author: github_actions
          message: "🤖 update tests screenshots"
